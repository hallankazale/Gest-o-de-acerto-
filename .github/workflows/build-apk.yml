name: Compilar Bolso+ APK
on:
  push:
    branches: [main, master, 'bolsoplus/**']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras financeiras
        run: |
          node tests/logic.test.cjs
          node --check app/src/main/assets/ui.js
          cd whatsapp-worker && npm run check && npm test
      - name: Preparar SDK
        run: |
          # GitHub hosted ubuntu runner already contains the Android SDK.
          # Avoid third-party setup that requests the removed Android "tools" package.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK instalável (debug)
        run: gradle --no-daemon assembleDebug
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: BolsoPlus-v1.3-multi-audio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
