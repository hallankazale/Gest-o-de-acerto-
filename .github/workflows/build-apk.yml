name: Compilar Bolso+ APK
on:
  push:
    branches: [main, master, 'bolsoplus/**']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras financeiras
        run: node tests/logic.test.cjs && node --check app/src/main/assets/ui.js
      - uses: android-actions/setup-android@v3
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK instalável (debug)
        run: gradle --no-daemon assembleDebug
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: BolsoPlus-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
